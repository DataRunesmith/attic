# Self-hosted copy. Set ADMIN_PASSWORD in the shell or in a .env file next to
# this file, then: docker compose up -d
services:
  attic:
    build: .
    restart: unless-stopped
    # Published on this machine only. To reach it from elsewhere, put a reverse
    # proxy with HTTPS in front; BIND_ADDRESS=0.0.0.0 opens the plain-HTTP port.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8787:8787"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD to at least 16 characters}
    volumes:
      - data:/data
volumes:
  data:
