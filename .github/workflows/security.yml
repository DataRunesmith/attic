name: Security scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check "semgrep==1.185.0"
      - name: Remove stale Semgrep report
        run: rm -f semgrep.sarif
      - name: Run Semgrep
        id: semgrep_scan
        env:
          SEMGREP_SEND_METRICS: "off"
        run: semgrep scan --config p/default --sarif --output semgrep.sarif .
      - name: Preserve Semgrep SARIF
        if: ${{ always() && steps.semgrep_scan.outcome == 'success' && hashFiles('semgrep.sarif') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sarif-semgrep
          path: semgrep.sarif
          if-no-files-found: error
          retention-days: 1
      - name: Summarize semgrep findings when SARIF upload is unavailable
        if: ${{ success() && steps.semgrep_scan.outcome == 'success' && hashFiles('semgrep.sarif') != '' && github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true) }}
        env:
          SARIF_FILE: semgrep.sarif
        run: |
          jq -r '
            [.runs[].results[]?] |
            if length == 0 then "No findings reported."
            else .[] |
              (if any(.suppressions[]?; .kind == "inSource") then "Suppressed" else "Finding" end) as $kind |
              ([.locations[]?.physicalLocation? | select(.artifactLocation.uri != null) | "\(.artifactLocation.uri):\(.region.startLine // 1)"] | join(", ") | @json) as $where |
              "\($kind): \(.ruleId // "unknown") at \($where)"
            end
          ' "$SARIF_FILE"
  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate npm lockfile for dependency analysis
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Remove stale Trivy report
        run: rm -f trivy.sarif
      - name: Run Trivy
        id: trivy_scan
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          version: v0.70.0
          scanners: vuln,misconfig,secret,license
          trivy-flags: --include-dev-deps
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"
          cache: false
      - name: Preserve Trivy SARIF
        if: ${{ always() && steps.trivy_scan.outcome == 'success' && hashFiles('trivy.sarif') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sarif-trivy
          path: trivy.sarif
          if-no-files-found: error
          retention-days: 1
      - name: Summarize trivy-filesystem findings when SARIF upload is unavailable
        if: ${{ success() && steps.trivy_scan.outcome == 'success' && hashFiles('trivy.sarif') != '' && github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true) }}
        env:
          SARIF_FILE: trivy.sarif
        run: |
          jq -r '
            [
              .runs[] as $run
              | $run.results[]?
              | . as $result
              | {
                  result: $result,
                  tags: (
                    ($run.tool.driver.rules // [])
                    | map(select(.id == $result.ruleId))
                    | .[0].properties.tags // []
                  )
                }
            ] as $items
            | ($items | map(select(any(.tags[]?; (ascii_downcase | contains("secret"))))) | length) as $secret_count
            | ($items | map(select((any(.tags[]?; (ascii_downcase | contains("secret")))) | not))) as $visible
            | if ($visible | length) == 0 and $secret_count == 0 then "No findings reported."
              else
                (
                  $visible[] |
                  (.tags | map(ascii_downcase)) as $tags |
                  (.result.ruleId // "") as $rule |
                  (if any($tags[]; contains("vulnerability")) or ($rule | startswith("CVE-") or startswith("GHSA-")) then "Vulnerability"
                   elif any($tags[]; contains("misconfig")) then "Misconfiguration"
                   elif any($tags[]; contains("license")) then "License"
                   else "Finding" end) as $kind |
                  (.result.properties.severity // .result.level // "unknown") as $severity |
                  (.result.message.text // "No detail") as $details |
                  ([.result.locations[]?.physicalLocation? | select(.artifactLocation.uri != null) | "\(.artifactLocation.uri):\(.region.startLine // 1)"] | join(", ") | @json) as $where |
                  "\($kind) [\($severity)] \($rule) at \($where): \($details | @json)"
                ),
                (if $secret_count > 0 then "Secret findings withheld from logs: \($secret_count)" else empty end)
              end
          ' "$SARIF_FILE"
  publish-sarif:
    name: Publish SARIF results
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
    needs: [semgrep, trivy]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Download scanner reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: sarif-*
          path: sarif
          merge-multiple: true
      - name: Upload Semgrep results
        if: ${{ success() && hashFiles('sarif/semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: sarif/semgrep.sarif
          category: semgrep
      - name: Upload Trivy results
        if: ${{ success() && hashFiles('sarif/trivy.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: sarif/trivy.sarif
          category: trivy-filesystem
